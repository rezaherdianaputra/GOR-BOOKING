<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Masuk - Jasa Tirta II Sport Center</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet">

            "secondary-container": "#58e6ff",

            "surface-container-lowest": "#ffffff",
            "inverse-on-surface": "#ecf1ff",
            "on-tertiary-fixed": "#191c1e",
            "secondary-fixed": "#a1efff",
            "on-tertiary-container": "#b9bcbf",
            "on-primary-fixed-variant": "#004398",
            "on-tertiary-fixed-variant": "#44474a",
            "primary-fixed": "#d9e2ff",
            "on-primary-fixed": "#001a43",
            "outline": "#737783",
            "inverse-primary": "#afc6ff",
            "secondary": "#006876",
            "on-primary-container": "#9ebbff",
            "on-background": "#111c2d",
            "on-error-container": "#93000a",
            "outline-variant": "#c3c6d4",
            "surface-dim": "#cfdaf2",
            "primary": "#003175",
            "tertiary-fixed": "#e0e3e6",
            "surface": "#f9f9ff",
            "background": "#f9f9ff",
            "tertiary": "#323538",
            "primary-container": "#0047a1",
            "surface-container": "#e7eeff",
            "surface-bright": "#f9f9ff",
            "surface-container-highest": "#d8e3fb",
            "inverse-surface": "#263143",
            "error": "#ba1a1a",
            "on-error": "#ffffff",
            "on-secondary": "#ffffff",
            "secondary-fixed-dim": "#44d8f1",
            "on-surface": "#111c2d",
            "tertiary-fixed-dim": "#c4c7ca",
            "on-tertiary": "#ffffff",
            "surface-container-high": "#dee8ff",
            "on-primary": "#ffffff",
            "surface-tint": "#265bb5",
            "tertiary-container": "#494c4e",
            "primary-fixed-dim": "#afc6ff",
            "on-surface-variant": "#434752",
            "on-secondary-fixed-variant": "#004e59",
            "on-secondary-container": "#006573",
            "surface-variant": "#d8e3fb"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",

          "fontFamily": {

            "body-sm": ["Inter"],
            "label-md": ["Inter"],
            "headline-lg-mobile": ["Inter"],

            "body-lg": ["Inter"],

            "body-md": ["Inter"],
            "label-sm": ["Inter"]
          },
          "fontSize": {
            "display": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
            "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600" }],
            "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
            "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
            "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
            "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
          }
        }
      }

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-surface text-on-surface min-h-screen flex flex-col">
  <main class="flex-grow flex items-center justify-center py-xl px-sm relative overflow-hidden">
    <!-- Background Decorative Elements -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden flex justify-center items-center opacity-30">
      <div class="w-[800px] h-[800px] rounded-full border-[1px] border-surface-container-highest absolute scale-150">
      </div>
      <div class="w-[600px] h-[600px] rounded-full border-[1px] border-surface-container-highest absolute scale-125">
      </div>
      <div class="w-[400px] h-[400px] rounded-full border-[1px] border-surface-container-highest absolute"></div>
    </div>
    <!-- Login Card -->
    <div
      class="bg-surface-container-lowest rounded-[24px] p-lg w-full max-w-md shadow-[0px_10px_30px_rgba(0,49,117,0.1)] border border-outline-variant/30 relative z-10 flex flex-col items-center">
      <!-- Logo & Brand -->
      <div class="flex justify-center mb-md w-full">
        <img src="images/logo-pjt.png" alt="Perum Jasa Tirta II Logo" class="h-16 object-contain">
      </div>
      <!-- Welcome Text -->
      <div class="text-center mb-xl">
        <h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Selamat Datang</h1>
        <p class="font-body-md text-body-md text-on-surface-variant">Masuk untuk mengelola dan memesan lapangan</p>
      </div>
      <!-- Form -->
      <form id="login-form" class="w-full flex flex-col gap-md">
        <!-- Email Field -->
        <div class="flex flex-col gap-base">
          <label class="font-label-md text-label-md text-on-surface-variant" for="email">Alamat Email</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">mail</span>
            <input
              class="w-full bg-surface-container-low border border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-lg py-sm pl-[48px] pr-sm font-body-md text-body-md text-on-surface placeholder-outline-variant transition-colors outline-none h-[48px]"
              id="email" placeholder="name@example.com" type="email" required autocomplete="email">
          </div>
        </div>
        <!-- Password Field -->
        <div class="flex flex-col gap-base">
          <label class="font-label-md text-label-md text-on-surface-variant" for="password">Kata Sandi</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock</span>
            <input
              class="w-full bg-surface-container-low border border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-lg py-sm pl-[48px] pr-sm font-body-md text-body-md text-on-surface placeholder-outline-variant transition-colors outline-none h-[48px]"
              id="password" placeholder="Masukkan kata sandi" type="password" required autocomplete="current-password">
          </div>
        </div>
        <!-- Captcha Field -->
        <div class="flex flex-col gap-base" id="captcha-container">
          <label class="font-label-md text-label-md text-on-surface-variant" for="captcha">Kode Verifikasi (Captcha)</label>
          <div class="flex gap-xs items-center">
            <div id="captcha-svg-wrapper" class="flex-grow h-[48px] overflow-hidden">
              <!-- Captcha SVG will be loaded here -->
            </div>
            <button type="button" id="btn-refresh-captcha" class="bg-surface-container-low hover:bg-surface-container-high text-primary border border-outline-variant/30 rounded-lg p-xs flex items-center justify-center h-[48px] w-[48px] transition-colors" title="Segarkan Captcha">
              <span class="material-symbols-outlined">refresh</span>
            </button>
          </div>
          <div class="relative mt-base">
            <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">shield</span>
            <input
              class="w-full bg-surface-container-low border border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-lg py-sm pl-[48px] pr-sm font-body-md text-body-md text-on-surface placeholder-outline-variant transition-colors outline-none h-[48px]"
              id="captcha" placeholder="Masukkan kode captcha" type="text" required autocomplete="off">
          </div>
          <input type="hidden" id="captcha-id">
        </div>
        <!-- Submit Button -->
        <button
          class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-sm rounded-lg hover:bg-primary active:scale-[0.98] transition-all flex items-center justify-center gap-xs mt-sm shadow-sm h-[48px]"
          type="submit">
          <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">login</span>Masuk
        </button>
      </form>
      <!-- Links -->
      <div class="mt-lg text-center flex flex-col gap-sm w-full">
        <p class="font-body-sm text-body-sm text-on-surface-variant">
          Belum punya akun? <a class="font-label-md text-label-md text-primary-container hover:underline"
            href="register.html">Daftar sekarang</a>
        </p>
        <div class="w-full h-px bg-outline-variant/30 my-xs"></div>
        <a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary flex items-center justify-center gap-base transition-colors"
          href="index.html">
          <span class="material-symbols-outlined text-[16px]">arrow_back</span>
          Kembali ke Beranda
        </a>
      </div>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div class="fixed top-5 right-5 z-50 flex flex-col gap-2" id="toast-container"></div>

  <script>
    // Redirect if already logged in
    const token = localStorage.getItem('token');
    const userJson = localStorage.getItem('user');
    if (token && userJson) {
      const user = JSON.parse(userJson);
      window.location.href = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
    }

    const form = document.getElementById('login-form');
    const toastContainer = document.getElementById('toast-container');
    const btnRefreshCaptcha = document.getElementById('btn-refresh-captcha');

    async function loadCaptcha() {
      try {
        const response = await fetch('/api/auth/captcha');
        const data = await response.json();
        if (data.success) {
          document.getElementById('captcha-svg-wrapper').innerHTML = data.svg;
          document.getElementById('captcha-id').value = data.id;
          document.getElementById('captcha').value = '';
        } else {
          showToast('Gagal memuat captcha.', 'error');
        }
      } catch (err) {
        console.error('Error loading captcha:', err);
        showToast('Gagal menghubungkan ke server untuk memuat captcha.', 'error');
      }
    }

    // Load captcha on page load
    loadCaptcha();

    btnRefreshCaptcha.addEventListener('click', loadCaptcha);

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg border transition-all duration-300 transform translate-y-2 opacity-0 ${type === 'success'
          ? 'bg-green-50 text-green-800 border-green-200'
          : 'bg-red-50 text-red-800 border-red-200'
        }`;
      toast.innerHTML = `
        <span class="material-symbols-outlined text-[20px]">${type === 'success' ? 'check_circle' : 'cancel'}</span>
        <span class="text-sm font-medium">${message}</span>
      `;
      toastContainer.appendChild(toast);

      // trigger transition
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const captcha_id = document.getElementById('captcha-id').value;
      const captcha_answer = document.getElementById('captcha').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password, captcha_id, captcha_answer })
        });

        const result = await response.json();

        if (result.success) {
          showToast(result.message, 'success');

          // Save credentials
          localStorage.setItem('token', result.token);
          localStorage.setItem('user', JSON.stringify(result.user));

          // Redirect based on role
          setTimeout(() => {
            if (result.user.role === 'admin') {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'dashboard.html';
            }
          }, 1000);
        } else {
          showToast(result.message, 'error');
          // Refresh captcha on failure
          loadCaptcha();
        }
      } catch (err) {
        console.error(err);
        showToast('Gagal menghubungkan ke server.', 'error');
        loadCaptcha();
      }
    });
  </script>
</body>

</html>
