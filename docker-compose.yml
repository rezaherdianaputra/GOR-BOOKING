version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: gor-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gor_booking
      MYSQL_USER: gor_user
      MYSQL_PASSWORD: gor_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: gor-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=gor_user
      - DB_PASSWORD=gor_password
      - DB_NAME=gor_booking
      - DB_PORT=3306
      - JWT_SECRET=supersecretkey12345
      - GOR_PRICE_PER_HOUR=100000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  db_data:
